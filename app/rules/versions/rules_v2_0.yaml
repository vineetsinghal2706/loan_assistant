          document_id: DB-MG
          document_title: DemoBank Residential Mortgage Eligibility Policy
          section: MG-2.2
          quote: "The applicant must be a citizen, a permanent resident, or a long-term visa holder with a residual visa term of at least 24 months."
        message_pass: "Residency status is eligible for this product."
        message_fail: "Residency status is not eligible for this product."
        message_unknown: "Residency status is needed before this criterion can be assessed."

      - id: MG-3.1-MIN-INCOME
        title: Minimum gross annual income
        category: income
        severity: HARD
        threshold: 36000
        observe: [gross_annual_income]
        condition:
          field: gross_annual_income
