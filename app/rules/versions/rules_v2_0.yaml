      - id: MG-4.2-INCOME-MULTIPLE
        title: Income multiple cap
        category: affordability
        severity: HARD
        threshold: 5.0
        observe: [income_multiple_used]
        condition:
          field: income_multiple_used
          op: lte
          value: 5.0
          label: Requested amount as a multiple of annual income
        policy_reference:
          document_id: DB-MG
          document_title: DemoBank Residential Mortgage Eligibility Policy
          section: MG-4.2
          quote: "The requested loan amount must not exceed 5.0 times gross verifiable annual income."
        message_pass: "Requested amount is within 5.0 times annual income."
        message_fail: "Requested amount exceeds 5.0 times annual income, the cap under policy version 2.0. Version 1.0 allowed 5.5 times."
        message_unknown: "Income and requested amount are both needed before the income multiple can be assessed."

      - id: MG-5.1-LTV
        title: Maximum loan to value, including first-time buyer concession
        category: security
        severity: HARD
        threshold: "85%, or 90% for a first-time buyer scoring 720 or above"
        observe: [ltv_ratio, property_value, requested_amount, is_first_time_buyer, credit_score]
        condition:
          any_of:
            - {field: ltv_ratio, op: lte, value: 0.85, label: Loan to value ratio}
            - all_of:
                - {field: is_first_time_buyer, op: is_true, label: First-time buyer}
                - {field: credit_score, op: gte, value: 720, label: Internal credit score}
                - {field: ltv_ratio, op: lte, value: 0.90, label: Loan to value ratio}
        policy_reference:
          document_id: DB-MG
          document_title: DemoBank Residential Mortgage Eligibility Policy
          section: MG-5.1
          quote: "The loan amount must not exceed 85% of the lower of purchase price and valuation, equivalent to a minimum deposit of 15%, except where the first-time buyer concession in section MG-5.4 applies."
        message_pass: "Loan to value satisfies section MG-5.1, or the first-time buyer concession in MG-5.4."
        message_fail: "Loan to value exceeds the 85% maximum in policy version 2.0 and the first-time buyer concession in MG-5.4 (90% at a credit score of 720 or above) is not met. Version 1.0 allowed 90% for all applicants."
        message_unknown: "Property value, requested amount, first-time buyer status and credit score are needed before loan to value can be assessed."
        remediation: "Increase the deposit to 15% of the property value, or reduce the requested amount."

      - id: MG-6.2-RESERVES
        title: Post-completion reserves
        category: affordability
        severity: SOFT
        threshold: "3x indicative monthly repayment"
        observe: [liquid_savings, reserves_multiple, estimated_monthly_payment]
        condition:
          field: reserves_multiple
          op: gte
          value: 3.0
          label: Liquid savings as a multiple of the indicative monthly repayment
        policy_reference:
          document_id: DB-MG
          document_title: DemoBank Residential Mortgage Eligibility Policy
          section: MG-6.2
          quote: "The applicant is expected to hold liquid savings, after payment of the deposit and fees, of at least three times the indicative monthly mortgage repayment."
        message_pass: "Reserves meet the three month expectation introduced in policy version 2.0."
        message_fail: "Reserves are below the three month expectation introduced in policy version 2.0, so the enquiry is referred to a credit officer."
        message_unknown: "Liquid savings were not declared, so this supporting criterion is referred rather than passed."

      - id: CR-2.1-CREDIT-SCORE
        title: Minimum internal credit score
        category: credit
        severity: HARD
        threshold: 680
        observe: [credit_score]
        condition:
          field: credit_score
          op: gte
          value: 680
          label: Internal credit score
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-2.1
          quote: "Minimum score for pre-qualification of a Residential Mortgage under version 2.0 is 680, raised from 660 in version 1.0."
        message_pass: "Internal credit score meets the policy version 2.0 mortgage minimum of 680."
        message_fail: "Internal credit score is below the policy version 2.0 mortgage minimum of 680. Version 1.0 required 660."
        message_unknown: "No internal credit score is available, so this criterion cannot be assessed."

      - id: CR-2.3-CREDIT-HISTORY
        title: Credit history depth
        category: credit
        severity: SOFT
        threshold: 24
        observe: [credit_history_months]
        condition:
          field: credit_history_months
          op: gte
          value: 24
          label: Months of credit history
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-2.3
          quote: "A credit history of at least 24 months is expected."
        message_pass: "Credit history depth meets the 24 month expectation."
        message_fail: "Credit history is shorter than 24 months, so the enquiry is referred for thin-file assessment."

      - id: CR-3.1-DTI
        title: Maximum debt-to-income ratio
        category: affordability
        severity: HARD
        threshold: 0.40
        observe: [dti_ratio, monthly_income, total_monthly_obligations, estimated_monthly_payment]
        condition:
          field: dti_ratio
          op: lte
          value: 0.40
          label: Debt-to-income ratio
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-3.1
          quote: "Maximum debt-to-income ratio for the Residential Mortgage under version 2.0 is 40%, reduced from 43% in version 1.0."
        message_pass: "Debt-to-income ratio including the indicative repayment is within the 40% maximum."
        message_fail: "Debt-to-income ratio including the indicative repayment exceeds the 40% maximum under policy version 2.0."
        message_unknown: "Income and existing monthly commitments are needed before affordability can be assessed."

      - id: CR-3.3-STRESSED-DTI
        title: Stressed affordability
        category: affordability
        severity: HARD
        threshold: 0.50
        observe: [stressed_dti_ratio, stressed_annual_rate, stressed_monthly_payment]
        condition:
          field: stressed_dti_ratio
          op: lte
          value: 0.50
          label: Debt-to-income ratio at the stressed rate
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-3.3
          quote: "The debt-to-income ratio recalculated with the representative interest rate increased by 2.00 percentage points must not exceed 50%."
        message_pass: "Affordability still holds when the representative rate is stressed by 2.00 percentage points."
        message_fail: "Affordability fails when the representative rate is stressed by 2.00 percentage points, a hard criterion introduced in policy version 2.0."
        message_unknown: "Income and existing monthly commitments are needed before stressed affordability can be assessed."

      - id: CR-4.1-BANKRUPTCY
        title: Bankruptcy discharge period
        category: credit
        severity: HARD
        threshold: "Discharged at least 4 years ago"
        observe: [has_prior_bankruptcy, years_since_bankruptcy]
        condition:
          any_of:
            - {field: has_prior_bankruptcy, op: is_false, label: Prior bankruptcy recorded}
            - {field: years_since_bankruptcy, op: gte, value: 4, label: Years since discharge}
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-4.1
          quote: "An applicant with a prior bankruptcy may be pre-qualified only where the arrangement was discharged at least 4 years before the date of enquiry."
        message_pass: "No bankruptcy restriction applies."
        message_fail: "A bankruptcy discharged less than 4 years ago blocks pre-qualification under policy version 2.0."
        message_unknown: "Confirmation of any prior bankruptcy and its discharge date is needed."

      - id: CR-4.2-ACTIVE-DEFAULTS
        title: No active defaults
        category: credit
        severity: SOFT
        threshold: 0
        observe: [active_defaults]
        condition:
          field: active_defaults
          op: lte
          value: 0
          label: Active defaults recorded
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-4.2
          quote: "The applicant should have no active defaults recorded."
        message_pass: "No active defaults are recorded."
        message_fail: "Active defaults are recorded, so the enquiry is referred to a credit officer."

      - id: DOC-2.1-VERIFICATION
        title: Supporting evidence verified
        category: documentation
        severity: SOFT
        observe: [documents_verified]
        condition:
          field: documents_verified
          op: is_true
          label: Supporting evidence verified
        policy_reference:
          document_id: DB-DOC
          document_title: DemoBank Documentation and Verification Standards
          section: DOC-2.1
          quote: "Unverified data is a supporting criterion failure, never a hard failure."
        message_pass: "Supporting evidence has been verified."
        message_fail: "Supporting evidence is not yet verified, so any positive outcome is conditional on verification and valuation."
        message_unknown: "Verification status is not recorded, so any positive outcome remains conditional."

  # ==================================================================
  AUTO_LOAN:
    display_name: Auto Loan
    assumptions:
      annual_interest_rate: 0.089
      default_term_months: 60
      stress_rate_increase: 0.02
      max_term_months: 72
    limits:
      min_amount: 5000
      max_amount: 75000
      max_dti: 0.42
      max_ltv: 0.85
    rules:
      - id: AL-2.1-AGE
        title: Applicant age within product range
        category: identity
        severity: HARD
        threshold: "21 to 70 years"
        observe: [age]
        condition:
          all_of:
            - {field: age, op: gte, value: 21, label: Applicant age}
            - {field: age, op: lte, value: 70, label: Applicant age}
        policy_reference:
          document_id: DB-AL
          document_title: DemoBank Auto Loan Eligibility Policy
          section: AL-2.1
          quote: "The applicant must be at least 21 and no more than 70 years of age at the date of application."
        message_pass: "Applicant age is inside the 21 to 70 range required for this product."
        message_fail: "Applicant age is outside the 21 to 70 range required for this product."
        message_unknown: "Applicant age is needed before the age criterion can be assessed."

      - id: AL-3.1-MIN-INCOME
        title: Minimum gross annual income
        category: income
        severity: HARD
        threshold: 20000
        observe: [gross_annual_income]
        condition:
          field: gross_annual_income
          op: gte
          value: 20000
          label: Gross verifiable annual income
        policy_reference:
          document_id: DB-AL
          document_title: DemoBank Auto Loan Eligibility Policy
          section: AL-3.1
          quote: "Gross verifiable annual income must be at least 20,000 currency units."
        message_pass: "Income meets the minimum of 20,000 for this product."
        message_fail: "Income is below the minimum of 20,000 required for this product."
        message_unknown: "Gross annual income is needed before the income criterion can be assessed."

      - id: AL-3.2-EMPLOYMENT
        title: Employment category and tenure
        category: employment
        severity: HARD
        threshold: "Eligible employment category with at least 6 months tenure"
        observe: [employment_status, employment_months]
        condition:
          all_of:
            - field: employment_status
              op: in
              value: [FULL_TIME, PART_TIME, SELF_EMPLOYED, CONTRACT]
              label: Employment status
            - field: employment_months
              op: gte
              value: 6
              label: Months in current employment
        policy_reference:
          document_id: DB-AL
          document_title: DemoBank Auto Loan Eligibility Policy
          section: AL-3.2
          quote: "At least 6 consecutive months in the current employment or trading arrangement is required."
        message_pass: "Employment category and tenure meet the 6 month requirement."
        message_fail: "Employment category or tenure does not meet the 6 month requirement."
        message_unknown: "Employment status and tenure are needed before this criterion can be assessed."

      - id: AL-4.1-AMOUNT-RANGE
        title: Requested amount within product range
        category: facility
        severity: HARD
        threshold: "5,000 to 75,000"
        observe: [requested_amount]
        condition:
          all_of:
            - {field: requested_amount, op: gte, value: 5000, label: Requested amount}
            - {field: requested_amount, op: lte, value: 75000, label: Requested amount}
        policy_reference:
          document_id: DB-AL
          document_title: DemoBank Auto Loan Eligibility Policy
          section: AL-4.1
          quote: "The Auto Loan is offered between 5,000 and 75,000 currency units."
        message_pass: "Requested amount is inside the product range of 5,000 to 75,000."
        message_fail: "Requested amount is outside the product range of 5,000 to 75,000."
        message_unknown: "A requested amount is needed before this criterion can be assessed."

      - id: AL-4.2-LTV
        title: Maximum loan to value
        category: security
        severity: HARD
        threshold: 0.85
        observe: [ltv_ratio, vehicle_value, requested_amount]
        condition:
          field: ltv_ratio
          op: lte
          value: 0.85
          label: Loan to value ratio
        policy_reference:
          document_id: DB-AL
          document_title: DemoBank Auto Loan Eligibility Policy
          section: AL-4.2
          quote: "The loan amount must not exceed 85% of the dealer invoice price or independent vehicle valuation, whichever is lower."
        message_pass: "Loan to value is within the 85% maximum permitted by policy version 2.0."
        message_fail: "Loan to value exceeds the 85% maximum permitted by policy version 2.0. Version 1.0 allowed 90%."
        message_unknown: "Vehicle value and requested amount are both needed before loan to value can be assessed."

      - id: AL-4.3-TERM
        title: Maximum scheduled term
        category: facility
        severity: HARD
        threshold: 72
        observe: [loan_term_months]
        condition:
          field: loan_term_months
          op: lte
          value: 72
          label: Scheduled term in months
        policy_reference:
          document_id: DB-AL
          document_title: DemoBank Auto Loan Eligibility Policy
          section: AL-4.3
          quote: "The maximum scheduled term is 72 months."
        message_pass: "Scheduled term is within the 72 month maximum."
        message_fail: "Scheduled term exceeds the 72 month maximum under policy version 2.0. Version 1.0 allowed 84 months."
        message_unknown: "A scheduled term is needed before this criterion can be assessed."

      - id: CR-2.1-CREDIT-SCORE
        title: Minimum internal credit score
        category: credit
        severity: HARD
        threshold: 640
        observe: [credit_score]
        condition:
          field: credit_score
          op: gte
          value: 640
          label: Internal credit score
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-2.1
          quote: "Minimum score for pre-qualification of an Auto Loan under version 2.0 is 640, raised from 620 in version 1.0."
        message_pass: "Internal credit score meets the policy version 2.0 auto loan minimum of 640."
        message_fail: "Internal credit score is below the policy version 2.0 auto loan minimum of 640. Version 1.0 required 620."
        message_unknown: "No internal credit score is available, so this criterion cannot be assessed."

      - id: CR-3.1-DTI
        title: Maximum debt-to-income ratio
        category: affordability
        severity: HARD
        threshold: 0.42
        observe: [dti_ratio, monthly_income, total_monthly_obligations, estimated_monthly_payment]
        condition:
          field: dti_ratio
          op: lte
          value: 0.42
          label: Debt-to-income ratio
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-3.1
          quote: "Maximum debt-to-income ratio for the Auto Loan under version 2.0 is 42%, reduced from 45% in version 1.0."
        message_pass: "Debt-to-income ratio including the indicative repayment is within the 42% maximum."
        message_fail: "Debt-to-income ratio including the indicative repayment exceeds the 42% maximum under policy version 2.0."
        message_unknown: "Income and existing monthly commitments are needed before affordability can be assessed."

      - id: CR-4.1-BANKRUPTCY
        title: Bankruptcy discharge period
        category: credit
        severity: HARD
        threshold: "Discharged at least 4 years ago"
        observe: [has_prior_bankruptcy, years_since_bankruptcy]
        condition:
          any_of:
            - {field: has_prior_bankruptcy, op: is_false, label: Prior bankruptcy recorded}
            - {field: years_since_bankruptcy, op: gte, value: 4, label: Years since discharge}
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-4.1
          quote: "An applicant with a prior bankruptcy may be pre-qualified only where the arrangement was discharged at least 4 years before the date of enquiry."
        message_pass: "No bankruptcy restriction applies."
        message_fail: "A bankruptcy discharged less than 4 years ago blocks pre-qualification under policy version 2.0."
        message_unknown: "Confirmation of any prior bankruptcy and its discharge date is needed."

      - id: CR-4.2-ACTIVE-DEFAULTS
        title: No active defaults
        category: credit
        severity: SOFT
        threshold: 0
        observe: [active_defaults]
        condition:
          field: active_defaults
          op: lte
          value: 0
          label: Active defaults recorded
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-4.2
          quote: "The applicant should have no active defaults recorded."
        message_pass: "No active defaults are recorded."
        message_fail: "Active defaults are recorded, so the enquiry is referred to a credit officer."

      - id: CR-2.3-CREDIT-HISTORY
        title: Credit history depth
        category: credit
        severity: SOFT
        threshold: 24
        observe: [credit_history_months]
        condition:
          field: credit_history_months
          op: gte
          value: 24
          label: Months of credit history
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-2.3
          quote: "A credit history of at least 24 months is expected."
        message_pass: "Credit history depth meets the 24 month expectation."
        message_fail: "Credit history is shorter than 24 months, so the enquiry is referred for thin-file assessment."

      - id: DOC-2.1-VERIFICATION
        title: Supporting evidence verified
        category: documentation
        severity: SOFT
        observe: [documents_verified]
        condition:
          field: documents_verified
          op: is_true
          label: Supporting evidence verified
        policy_reference:
          document_id: DB-DOC
          document_title: DemoBank Documentation and Verification Standards
          section: DOC-2.1
          quote: "Unverified data is a supporting criterion failure, never a hard failure."
        message_pass: "Supporting evidence has been verified."
        message_fail: "Supporting evidence is not yet verified, so any positive outcome is conditional on verification."
        message_unknown: "Verification status is not recorded, so any positive outcome remains conditional."
