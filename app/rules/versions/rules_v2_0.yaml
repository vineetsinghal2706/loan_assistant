# Machine-readable encoding of the DemoBank policy corpus version 2.0.
# =====================================================================
policy_version: "2.0"
title: DemoBank Retail Credit Policy v2.0
status: active
effective_from: "2025-07-01"
effective_to: null
summary: >-
  Current DemoBank pre-qualification policy. Tightens credit score,
  debt-to-income and loan-to-value criteria, introduces a stressed
  affordability test, a savings buffer and a first-time buyer loan-to-value
  concession, and shortens the bankruptcy discharge waiting period.
change_log:
  - "CR-2.1: minimum credit score raised to 660 personal / 680 mortgage / 640 auto."
  - "CR-3.1: maximum debt-to-income reduced to 40% personal / 40% mortgage / 42% auto."
  - "CR-3.3: new stressed affordability hard criterion at +2.00 percentage points, capped at 50%."
  - "CR-4.1: bankruptcy discharge waiting period reduced from 5 years to 4 years."
  - "PL-3.2: minimum employment tenure raised from 6 to 12 months."
  - "PL-4.1: maximum personal loan amount raised from 50,000 to 60,000."
  - "PL-4.2: personal loan income multiple reduced from 5.0x to 4.5x."
  - "PL-5.2: new savings buffer supporting criterion."
  - "MG-4.2: mortgage income multiple reduced from 5.5x to 5.0x."
  - "MG-5.1: maximum loan to value reduced from 90% to 85%."
  - "MG-5.4: new first-time buyer concession to 90% loan to value at credit score 720+."
  - "MG-6.2: new reserves supporting criterion."
  - "AL-4.2: auto loan to value reduced from 90% to 85%."
  - "AL-4.3: auto maximum term reduced from 84 to 72 months."
documents:
  - DB-PL
  - DB-MG
  - DB-AL
  - DB-CR
  - DB-DOC

products:
  # ==================================================================
  PERSONAL_LOAN:
    display_name: Unsecured Personal Loan
    assumptions:
      annual_interest_rate: 0.129
      default_term_months: 60
      stress_rate_increase: 0.02
    limits:
      min_amount: 2000
      max_amount: 60000
      income_multiple: 4.5
      max_dti: 0.40
      max_stressed_dti: 0.50
    rules:
      - id: PL-2.1-AGE
        title: Applicant age within product range
        category: identity
        severity: HARD
        threshold: "21 to 70 years"
        observe: [age]
        condition:
          all_of:
            - {field: age, op: gte, value: 21, label: Applicant age}
            - {field: age, op: lte, value: 70, label: Applicant age}
        policy_reference:
          document_id: DB-PL
          document_title: DemoBank Unsecured Personal Loan Eligibility Policy
          section: PL-2.1
          quote: "The applicant must be at least 21 years of age and no more than 70 years of age at the date of application."
        message_pass: "Applicant age is inside the 21 to 70 range required for this product."
        message_fail: "Applicant age is outside the 21 to 70 range required for this product."
        message_unknown: "Applicant age is needed before the age criterion can be assessed."

      - id: PL-2.2-RESIDENCY
        title: Eligible residency status
        category: identity
        severity: HARD
        observe: [residency_status]
        condition:
          field: residency_status
          op: in
          value: [CITIZEN, PERMANENT_RESIDENT, LONG_TERM_VISA]
          label: Residency status
        policy_reference:
          document_id: DB-PL
          document_title: DemoBank Unsecured Personal Loan Eligibility Policy
          section: PL-2.2
          quote: "The applicant must hold one of the following residency statuses: citizen, permanent resident, long-term visa holder."
        message_pass: "Residency status is eligible for this product."
        message_fail: "Short-term visa holders and non-residents are not eligible for this product."
        message_unknown: "Residency status is needed before this criterion can be assessed."

      - id: PL-3.1-MIN-INCOME
        title: Minimum gross annual income
        category: income
        severity: HARD
        threshold: 24000
        observe: [gross_annual_income]
        condition:
          field: gross_annual_income
          op: gte
          value: 24000
          label: Gross verifiable annual income
        policy_reference:
          document_id: DB-PL
          document_title: DemoBank Unsecured Personal Loan Eligibility Policy
          section: PL-3.1
          quote: "Gross verifiable annual income must be at least 24,000 currency units."
        message_pass: "Income meets the minimum of 24,000 for this product."
        message_fail: "Income is below the minimum of 24,000 required for this product."
        message_unknown: "Gross annual income is needed before the income criterion can be assessed."

      - id: PL-3.2-EMPLOYMENT
        title: Employment category and tenure
        category: employment
        severity: HARD
        threshold: "Eligible employment category with at least 12 months tenure"
        observe: [employment_status, employment_months]
        condition:
          all_of:
            - field: employment_status
              op: in
              value: [FULL_TIME, PART_TIME, SELF_EMPLOYED, CONTRACT]
              label: Employment status
            - field: employment_months
              op: gte
              value: 12
              label: Months in current employment
        policy_reference:
          document_id: DB-PL
          document_title: DemoBank Unsecured Personal Loan Eligibility Policy
          section: PL-3.2
          quote: "The applicant must have been in the current employment or trading arrangement for at least 12 consecutive months. This tenure requirement was raised from 6 months in version 1.0."
        message_pass: "Employment category and tenure meet the policy version 2.0 requirement of 12 months."
        message_fail: "Employment category or tenure does not meet the policy version 2.0 requirement of 12 months. Version 1.0 required only 6 months."
        message_unknown: "Employment status and tenure are needed before this criterion can be assessed."

      - id: PL-3.4-SELF-EMPLOYED-HISTORY
        title: Self-employed trading history
        category: employment
        severity: SOFT
        threshold: 24
        observe: [employment_status, employment_months]
        applies_when:
          field: employment_status
          op: eq
          value: SELF_EMPLOYED
          label: Employment status
        condition:
          field: employment_months
          op: gte
          value: 24
          label: Months of trading history
        policy_reference:
          document_id: DB-PL
          document_title: DemoBank Unsecured Personal Loan Eligibility Policy
          section: PL-3.4
          quote: "Where the applicant is self employed, a trading history of at least 24 months is expected."
        message_pass: "Self-employed trading history meets the 24 month expectation."
        message_fail: "Self-employed trading history is under 24 months, so the enquiry is referred to a credit officer."

      - id: PL-4.1-AMOUNT-RANGE
        title: Requested amount within product range
        category: facility
        severity: HARD
        threshold: "2,000 to 60,000"
        observe: [requested_amount]
        condition:
          all_of:
            - {field: requested_amount, op: gte, value: 2000, label: Requested amount}
            - {field: requested_amount, op: lte, value: 60000, label: Requested amount}
        policy_reference:
          document_id: DB-PL
          document_title: DemoBank Unsecured Personal Loan Eligibility Policy
          section: PL-4.1
          quote: "The Unsecured Personal Loan is offered between 2,000 and 60,000 currency units."
        message_pass: "Requested amount is inside the product range of 2,000 to 60,000."
        message_fail: "Requested amount is outside the product range of 2,000 to 60,000."
        message_unknown: "A requested amount is needed before this criterion can be assessed."

      - id: PL-4.2-INCOME-MULTIPLE
        title: Income multiple cap
        category: affordability
        severity: HARD
        threshold: 4.5
        observe: [income_multiple_used, gross_annual_income, requested_amount]
        condition:
          field: income_multiple_used
          op: lte
          value: 4.5
          label: Requested amount as a multiple of annual income
        policy_reference:
          document_id: DB-PL
          document_title: DemoBank Unsecured Personal Loan Eligibility Policy
          section: PL-4.2
          quote: "The requested loan amount must not exceed 4.5 times gross verifiable annual income."
        message_pass: "Requested amount is within 4.5 times annual income."
        message_fail: "Requested amount exceeds 4.5 times annual income, the cap under policy version 2.0. Version 1.0 allowed 5.0 times."
        message_unknown: "Income and requested amount are both needed before the income multiple can be assessed."

      - id: PL-5.2-SAVINGS-BUFFER
        title: Savings buffer
        category: affordability
        severity: SOFT
        threshold: "3x total monthly obligations"
        observe: [liquid_savings, savings_buffer_multiple, total_monthly_obligations]
        condition:
          field: savings_buffer_multiple
          op: gte
          value: 3.0
          label: Liquid savings as a multiple of total monthly obligations
        policy_reference:
          document_id: DB-PL
          document_title: DemoBank Unsecured Personal Loan Eligibility Policy
          section: PL-5.2
          quote: "The applicant is expected to hold liquid savings of at least three times total monthly credit obligations. A shortfall, or an undeclared savings position, is a supporting criterion failure and results in referral, not a decline."
        message_pass: "Liquid savings meet the three month buffer expectation introduced in policy version 2.0."
        message_fail: "Liquid savings are below the three month buffer expectation introduced in policy version 2.0, so the enquiry is referred to a credit officer."
        message_unknown: "Liquid savings were not declared, so this supporting criterion is referred rather than passed."
        remediation: "Declare liquid savings and supply the supporting statement."

      - id: CR-2.1-CREDIT-SCORE
        title: Minimum internal credit score
        category: credit
        severity: HARD
        threshold: 660
        observe: [credit_score]
        condition:
          field: credit_score
          op: gte
          value: 660
          label: Internal credit score
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-2.1
          quote: "Minimum score for pre-qualification of an Unsecured Personal Loan under version 2.0 is 660, raised from 640 in version 1.0."
        message_pass: "Internal credit score meets the policy version 2.0 minimum of 660."
        message_fail: "Internal credit score is below the policy version 2.0 minimum of 660. Version 1.0 required 640."
        message_unknown: "No internal credit score is available, so this criterion cannot be assessed. Under CR-2.2 this is recorded as insufficient information and never as a decline."
        remediation: "Complete a full application so that an internal credit score can be produced."

      - id: CR-2.3-CREDIT-HISTORY
        title: Credit history depth
        category: credit
        severity: SOFT
        threshold: 24
        observe: [credit_history_months]
        condition:
          field: credit_history_months
          op: gte
          value: 24
          label: Months of credit history
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-2.3
          quote: "A credit history of at least 24 months is expected. A shorter history is a supporting criterion failure, producing referral for thin-file assessment rather than a decline."
        message_pass: "Credit history depth meets the 24 month expectation."
        message_fail: "Credit history is shorter than 24 months, so the enquiry is referred for thin-file assessment."

      - id: CR-3.1-DTI
        title: Maximum debt-to-income ratio
        category: affordability
        severity: HARD
        threshold: 0.40
        observe: [dti_ratio, monthly_income, total_monthly_obligations, estimated_monthly_payment]
        condition:
          field: dti_ratio
          op: lte
          value: 0.40
          label: Debt-to-income ratio
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-3.1
          quote: "Maximum debt-to-income ratio for the Unsecured Personal Loan under version 2.0 is 40%, reduced from 45% in version 1.0."
        message_pass: "Debt-to-income ratio including the indicative repayment is within the 40% maximum."
        message_fail: "Debt-to-income ratio including the indicative repayment exceeds the 40% maximum under policy version 2.0. Version 1.0 allowed 45%."
        message_unknown: "Income and existing monthly commitments are needed before affordability can be assessed."
        remediation: "Reduce the requested amount, extend the term, or reduce existing monthly commitments."

      - id: CR-3.3-STRESSED-DTI
        title: Stressed affordability
        category: affordability
        severity: HARD
        threshold: 0.50
        observe: [stressed_dti_ratio, stressed_annual_rate, stressed_monthly_payment]
        condition:
          field: stressed_dti_ratio
          op: lte
          value: 0.50
          label: Debt-to-income ratio at the stressed rate
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-3.3
          quote: "The debt-to-income ratio recalculated with the representative interest rate increased by 2.00 percentage points must not exceed 50%. This stressed test is a hard criterion."
        message_pass: "Affordability still holds when the representative rate is stressed by 2.00 percentage points."
        message_fail: "Affordability fails when the representative rate is stressed by 2.00 percentage points, a hard criterion introduced in policy version 2.0."
        message_unknown: "Income and existing monthly commitments are needed before stressed affordability can be assessed."

      - id: CR-4.1-BANKRUPTCY
        title: Bankruptcy discharge period
        category: credit
        severity: HARD
        threshold: "Discharged at least 4 years ago"
        observe: [has_prior_bankruptcy, years_since_bankruptcy]
        condition:
          any_of:
            - {field: has_prior_bankruptcy, op: is_false, label: Prior bankruptcy recorded}
            - {field: years_since_bankruptcy, op: gte, value: 4, label: Years since discharge}
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-4.1
          quote: "An applicant with a prior bankruptcy may be pre-qualified only where the arrangement was discharged at least 4 years before the date of enquiry."
        message_pass: "No bankruptcy restriction applies."
        message_fail: "A bankruptcy or insolvency arrangement discharged less than 4 years ago blocks pre-qualification under policy version 2.0."
        message_unknown: "Confirmation of any prior bankruptcy and its discharge date is needed before this criterion can be assessed."

      - id: CR-4.2-ACTIVE-DEFAULTS
        title: No active defaults
        category: credit
        severity: SOFT
        threshold: 0
        observe: [active_defaults]
        condition:
          field: active_defaults
          op: lte
          value: 0
          label: Active defaults recorded
        policy_reference:
          document_id: DB-CR
          document_title: DemoBank Credit and Affordability Standards
          section: CR-4.2
          quote: "The applicant should have no active defaults recorded."
        message_pass: "No active defaults are recorded."
        message_fail: "Active defaults are recorded, so the enquiry is referred to a credit officer."

      - id: DOC-2.1-VERIFICATION
        title: Supporting evidence verified
        category: documentation
        severity: SOFT
        observe: [documents_verified]
        condition:
          field: documents_verified
          op: is_true
          label: Supporting evidence verified
        policy_reference:
          document_id: DB-DOC
          document_title: DemoBank Documentation and Verification Standards
          section: DOC-2.1
          quote: "Unverified data is a supporting criterion failure, never a hard failure."
        message_pass: "Supporting evidence has been verified."
        message_fail: "Supporting evidence is not yet verified, so any positive outcome is conditional on verification."
        message_unknown: "Verification status is not recorded, so any positive outcome remains conditional on verification."

  # ==================================================================
  MORTGAGE:
