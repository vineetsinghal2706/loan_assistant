# Prometheus configuration for the DemoBank Loan Eligibility Assistant demo.
global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    environment: demo
    service: demobank-loan-eligibility

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: demobank-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: eligibility-api
