          document_id: DB-MG
          document_title: DemoBank Residential Mortgage Eligibility Policy
          section: MG-3.2
          quote: "At least 12 consecutive months in the current employment or trading arrangement is required."
        message_pass: "Employment category and tenure meet the 12 month mortgage requirement."
        message_fail: "Employment category or tenure does not meet the 12 month mortgage requirement."
        message_unknown: "Employment status and tenure are needed before this criterion can be assessed."

      - id: MG-4.1-AMOUNT-RANGE
        title: Requested amount within product range
        category: facility
        severity: HARD
        threshold: "50,000 to 750,000"
        observe: [requested_amount]
        condition:
          all_of:
            - {field: requested_amount, op: gte, value: 50000, label: Requested amount}
            - {field: requested_amount, op: lte, value: 750000, label: Requested amount}
        policy_reference:
          document_id: DB-MG
          document_title: DemoBank Residential Mortgage Eligibility Policy
          section: MG-4.1
