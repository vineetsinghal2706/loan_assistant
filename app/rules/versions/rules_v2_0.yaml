      max_amount: 750000
      income_multiple: 5.0
      max_dti: 0.40
      max_stressed_dti: 0.50
      max_ltv: 0.85
    rules:
      - id: MG-2.1-AGE
        title: Applicant age within product range
        category: identity
        severity: HARD
        threshold: "21 to 65 years"
        observe: [age]
        condition:
          all_of:
            - {field: age, op: gte, value: 21, label: Applicant age}
            - {field: age, op: lte, value: 65, label: Applicant age}
